kind: Deployment
metadata:
  name: GS-deployment
  labels:
    app: GS-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: GS-app
  template:
    metadata:
      labels:
        app: GS-app
    spec:
      containers:
      - name: web-server
        image: python:3.10-slim
        command: ["python3", "-c"]
        args:
        - |
          import http.server, socketserver

          class AuthHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  auth_header = self.headers.get("Authorization")
                  # Check for valid bearer token or basic auth
                  if auth_header == "Bearer secret-token":
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      self.end_headers()
                      self.wfile.write("🚀 200 OK: Authentication successful! Welcome.\n".encode("utf-8"))
                  else:
                      self.send_response(401)
                      self.send_header("WWW-Authenticate", 'Bearer realm="WezvaTech Lab"')
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      self.end_headers()
                      self.wfile.write("❌ 401 Unauthorized: Missing or invalid Authorization header.\n".encode("utf-8"))

          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(("0.0.0.0", 8080), AuthHandler) as httpd:
              httpd.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: GS-service
spec:
  selector:
    app: GS-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: GS-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: GS-service
            port:
              number: 80
