apiVersion: apps/v1
kind: Deployment
metadata:
  name: GS-deployment
  labels:
    app: GS-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: GS-app
  template:
    metadata:
      labels:
        app: GS-app
    spec:
      containers:
      - name: web-server
        image: python:3.10-slim
        command: ["python3", "-c"]
        args:
        - |
          import http.server, socketserver, os, sys

          class AppHandler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/healthz":
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      self.end_headers()
                      self.wfile.write("OK\n".encode("utf-8"))
                      return

                  try:
                      # 📌 INTENTIONAL ERROR: Expects DATABASE_URL env var
                      db_conn = os.environ["DATABASE_URL"]
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      self.end_headers()
                      self.wfile.write(f"🚀 200 OK: Connected to DB at {db_conn}\n".encode("utf-8"))
                  except KeyError:
                      sys.stderr.write("⚠️ ERROR: 'DATABASE_URL' environment variable is missing!\n")
                      sys.stderr.flush()
                      self.send_response(500)
                      self.send_header("Content-Type", "text/plain; charset=utf-8")
                      self.end_headers()
                      self.wfile.write("❌ HTTP 500: Internal Server Error. Check app logs for trace.\n".encode("utf-8"))

          socketserver.TCPServer.allow_reuse_address = True
          with socketserver.TCPServer(("0.0.0.0", 8080), AppHandler) as httpd:
              httpd.serve_forever()
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: GS-service
spec:
  selector:
    app: GS-app
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: GS-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: GS-service
            port:
              number: 80
